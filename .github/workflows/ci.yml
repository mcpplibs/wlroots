name: ci

# What this checks that a plain `mcpp build` does not:
#
#   - that the package builds on BOTH toolchains. The llvm leg uses lld and no
#     sysroot, and in this ecosystem it has twice caught bugs gcc structurally
#     cannot see (a `static inline` whose address forced TU-local emission; a
#     <sstream> that libstdc++ includes transitively and libc++ does not).
#   - that upstream/ is the release tarball, byte for byte. Everything this
#     fork adds lives under mcpp/.
#   - that the default feature set is the one the manifest claims — read out of
#     the GENERATED wlr/config.h, because a green build proves only that the
#     link succeeded, and a package can link having compiled nothing.
on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [default, llvm]
    name: build (${{ matrix.toolchain }})
    steps:
      - uses: actions/checkout@v4

      # XLINGS_NON_INTERACTIVE: without it the installer takes its `curl | bash`
      # branch (`xlings self install < /dev/tty`) and a runner's /dev/tty is
      # readable but not connected.
      #
      # XLINGS_VERSION pins the INSTALLER so a red run can be told apart from an
      # ecosystem change. mcpp itself stays unpinned on purpose — this package
      # depends on the current ecosystem, and a pinned mcpp carries a frozen
      # snapshot of it.
      #
      # TWO PATH entries, and the second is the one that matters: `xlings`
      # lands in ~/.xlings/bin, but `mcpp` is installed INTO THE SUBOS, so
      # without subos/default/bin the next step dies with a bare
      # `mcpp: command not found` that says nothing about why.
      - name: Install xlings + mcpp
        env:
          XLINGS_NON_INTERACTIVE: "1"
          XLINGS_VERSION: "2026.8.27.5"
        run: |
          curl -fsSL https://d2learn.org/xlings-install.sh | bash
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          "$HOME/.xlings/bin/xlings" --version
          "$HOME/.xlings/bin/xlings" install mcpp
          echo "$HOME/.xlings/subos/default/bin" >> "$GITHUB_PATH"

      # A clean runner carries the index snapshot of the day its image was
      # built, so a package published since then is simply absent. This fork
      # needs freedesktop.wayland-protocols-* 1.49.1, which is recent.
      - name: refresh the index
        run: mcpp index update

      # `toolchain default` alone fails with "llvm@ is not installed": the
      # runner image carries only the default toolchain, so the payload has to
      # be fetched before it can be selected.
      - name: select toolchain
        if: matrix.toolchain == 'llvm'
        run: |
          mcpp toolchain install llvm
          mcpp toolchain default llvm

      - name: build and test
        run: |
          cd mcpp/wlroots
          mcpp test

      - name: the generated wlr/config.h says what the manifest says
        run: |
          cd mcpp/wlroots
          echo "--- include/wlr/config.h ---"
          grep '^#define WLR_HAS' include/wlr/config.h
          for on in DRM_BACKEND LIBINPUT_BACKEND SESSION GLES2_RENDERER GBM_ALLOCATOR; do
            grep -qx "#define WLR_HAS_$on 1" include/wlr/config.h || {
              echo "::error::WLR_HAS_$on is not 1, but it is in the default feature set"; exit 1; }
          done
          for off in X11_BACKEND VULKAN_RENDERER XWAYLAND COLOR_MANAGEMENT; do
            grep -qx "#define WLR_HAS_$off 0" include/wlr/config.h || {
              echo "::error::WLR_HAS_$off is not 0, but the manifest does not offer it"; exit 1; }
          done
          # ⚠️ COUNT THE GENERATED ARTIFACTS, NOT THE OBJECTS.
          #
          # A total object count is not comparable between a runner and a
          # developer's tree: locally the dependencies also build into target/
          # and the number is 2191, on a runner it is 481, and a threshold
          # calibrated on either one is a coin flip rather than a check. It
          # failed here for exactly that reason.
          #
          # These four counts follow from upstream's own file lists and the
          # pinned data, so each has a right answer that does not depend on
          # where the build ran.
          o=target/.build-mcpp/out
          p=$(ls $o/*-protocol.c 2>/dev/null | wc -l)
          s=$(ls $o/*_src.h 2>/dev/null | wc -l)
          c=$(grep -c 'case PNP_ID' $o/pnpids.c)
          e=$(grep -c '^using ::' src/wlroots.cppm)
          echo "protocols scanned: $p   shaders: $s   PNP entries: $c   module exports: $e"
          [ "$p" -eq 13 ]   || { echo "::error::$p protocols scanned, expected the 13 wlroots ships"; exit 1; }
          [ "$s" -eq 5 ]    || { echo "::error::$s shader headers, expected 5"; exit 1; }
          [ "$c" -gt 2500 ] || { echo "::error::only $c PNP entries; the pinned pnp.ids has 2557"; exit 1; }
          [ "$e" -gt 900 ]  || { echo "::error::only $e module exports; the header scan missed something"; exit 1; }
          echo "objects: $(find target -name '*.o' | wc -l)"

      # The pinned pnp.ids is the whole reason the DRM backend's manufacturer
      # lookup is reproducible. Upstream's gen_pnpids.sh reads the BUILD
      # MACHINE's copy, so the failure this prevents looks exactly like a
      # passing build.
      - name: the pinned pnp.ids is NOT the runner's
        if: matrix.toolchain == 'default'
        run: |
          if [ -f /usr/share/hwdata/pnp.ids ]; then
            d=$(diff <(sort mcpp/data/pnp.ids) <(sort /usr/share/hwdata/pnp.ids) | grep -c '^[<>]' || true)
            echo "pinned pnp.ids differs from the runner's by $d line(s)"
          else
            echo "the runner has no /usr/share/hwdata/pnp.ids — which is why upstream's fallback is a trap"
          fi

  upstream:
    runs-on: ubuntu-latest
    name: upstream/ is the release tarball, unmodified
    steps:
      - uses: actions/checkout@v4
      - name: diff upstream/ against wlroots 0.20.2
        run: |
          curl -fsSL -o /tmp/u.tar.gz \
            https://gitlab.freedesktop.org/wlroots/wlroots/-/archive/0.20.2/wlroots-0.20.2.tar.gz
          mkdir -p /tmp/u && tar xzf /tmp/u.tar.gz -C /tmp/u --strip-components=1
          if ! diff -r -q /tmp/u upstream >/dev/null 2>&1; then
            echo "::error::upstream/ differs from wlroots 0.20.2. Everything this fork adds belongs under mcpp/."
            diff -r -q /tmp/u upstream | head -20
            exit 1
          fi
          echo "upstream/ is 0.20.2, unmodified"
